                  const SizedBox(height: 10),
                  Text('• Relay -> App: P50 = ${t.relayToAppP50} ms | P95 = ${t.relayToAppP95} ms'),
                  Text('• App -> Hiển thị UI: P50 = ${t.appToUiP50} ms | P95 = ${t.appToUiP95} ms'),
                  Text(
                    '• Tổng độ trễ (Relay -> Màn hình): P50 = ${t.totalRelayToUiP50} ms | P95 = ${t.totalRelayToUiP95} ms',
                    style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.greenAccent),
                  ),
                  Text('• Chạm bình luận -> Gửi lệnh in: P50 = ${t.tapToPrintP50} ms | P95 = ${t.tapToPrintP95} ms'),
                  const SizedBox(height: 20),
                  ElevatedButton(
                    onPressed: () => widget.telemetry.reset(),
                    child: const Text('ĐẶT LẠI BỘ ĐO ĐỘ TRỄ'),
                  ),
                ],
              );
            }
          }
          EOF

      - name: Install dependencies and build Release APK
        working-directory: chotlive_build
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload CHOTLIVE APK
        uses: actions/upload-artifact@v4
        with:
          name: CHOTLIVE-v2.0-Android-APK
          path: chotlive_build/build/app/outputs/flutter-apk/app-release.apk
