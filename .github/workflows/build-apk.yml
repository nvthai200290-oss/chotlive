name: Build CHOTLIVE Android APK
on:
  push:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Initialize Android platform files if missing
        run: flutter create . --project-name chotlive --org vn.thaonguyen.chotlive

      - name: Inject Bluetooth and Cleartext permissions into AndroidManifest
        run: |
          python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = """    <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
          """
          if "BLUETOOTH_CONNECT" not in s:
              s = s.replace("<application", perms + "\n    <application\n        android:usesCleartextTraffic=\"true\"", 1)
          open(p, "w", encoding="utf-8").write(s)
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload CHOTLIVE APK
        uses: actions/upload-artifact@v4
        with:
          name: CHOTLIVE-v2.0-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
