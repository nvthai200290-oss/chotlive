name: Build CHOTLIVE Android APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable

      - name: Initialize Android project from committed Dart source
        run: |
          flutter create --platforms=android --project-name chotlive --org vn.thaonguyen.chotlive chotlive_build
          cp pubspec.yaml chotlive_build/pubspec.yaml
          rm -rf chotlive_build/lib
          cp -R lib chotlive_build/lib

      - name: Configure Bluetooth and network permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("chotlive_build/android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          permissions = """    <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
          """
          s = s.replace("<application", permissions + "    <application", 1)
          s = s.replace('android:label="chotlive"', 'android:label="CHOTLIVE"')
          s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Build release APK
        working-directory: chotlive_build
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CHOTLIVE-Android-APK
          path: chotlive_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
