name: Build CHOTLIVE Android APK
on:
  push:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Initialize clean Flutter Android project
        run: |
          rm -rf chotlive_build
          flutter create --platforms=android --project-name chotlive --org vn.thaonguyen.chotlive chotlive_build

      - name: Write pubspec.yaml and AndroidManifest.xml
        run: |
          cat << 'EOF' > chotlive_build/pubspec.yaml
          name: chotlive
          description: Ung dung nhan binh luan TikTok LIVE va in phieu nhiet tuc thoi.
          publish_to: 'none'
          version: 2.0.0+1

          environment:
            sdk: '>=3.2.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            web_socket_channel: ^2.4.5
            sqflite: ^2.3.3+1
            path: ^1.9.0
            shared_preferences: ^2.2.3
            print_bluetooth_thermal: ^1.1.1
            permission_handler: ^11.3.1
            intl: ^0.19.0

          flutter:
            uses-material-design: true
          EOF

          cat << 'EOF' > chotlive_build/android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />

              <application
                  android:label="CHOTLIVE"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Generate complete CHOTLIVE v2.0 source code (lib/main.dart)
        run: |
          cat << 'EOF' > chotlive_build/lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:typed_data';
          import 'dart:ui' as ui;
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:intl/intl.dart';
          import 'package:path/path.dart' as p;
          import 'package:permission_handler/permission_handler.dart';
          import 'package:print_bluetooth_thermal/print_bluetooth_thermal.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:sqflite/sqflite.dart';
          import 'package:web_socket_channel/web_socket_channel.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            final settings = SettingsService();
            await settings.init();
            final localDb = LocalDatabase();
            await localDb.init();
            final telemetry = TelemetryService();
            final commentSource = CommentSource(telemetry: telemetry);
            final printerService = PrinterService(settings: settings);
            final ticketService = TicketService(
              printerService: printerService,
              localDatabase: localDb,
              telemetryService: telemetry,
            );
            unawaited(printerService.autoReconnectSavedPrinter());
            runApp(ChotLiveApp(
              settings: settings,
              localDb: localDb,
              telemetry: telemetry,
              commentSource: commentSource,
              printerService: printerService,
              ticketService: ticketService,
            ));
          }

          class LiveComment {
            final String msgId;
            final String uniqueId;
            final String nickname;
            final String comment;
            final int tRelayRecv;
            final int tAppRecv;
            int? tUiRender;
            int printCount;
            String lastPrintStatus;

            LiveComment({
              required this.msgId,
              required this.uniqueId,
              required this.nickname,
              required this.comment,
              required this.tRelayRecv,
              required this.tAppRecv,
              this.tUiRender,
              this.printCount = 0,
              this.lastPrintStatus = 'idle',
            });
          }

          class PrintedTicket {
            final int? id;
            final String msgId;
            final String uniqueId;
            final String nickname;
            final String comment;
            final int createdAt;
            final int printLatencyMs;
            final bool printSuccess;

            PrintedTicket({
              this.id,
              required this.msgId,
              required this.uniqueId,
              required this.nickname,
              required this.comment,
              required this.createdAt,
              required this.printLatencyMs,
              required this.printSuccess,
            });

            Map<String, dynamic> toMap() => {
                  'id': id,
                  'msg_id': msgId,
                  'unique_id': uniqueId,
                  'nickname': nickname,
                  'comment': comment,
                  'created_at': createdAt,
                  'print_latency_ms': printLatencyMs,
                  'print_success': printSuccess ? 1 : 0,
                };

            factory PrintedTicket.fromMap(Map<String, dynamic> map) => PrintedTicket(
                  id: map['id'] as int?,
                  msgId: (map['msg_id'] ?? '').toString(),
                  uniqueId: (map['unique_id'] ?? '').toString(),
                  nickname: (map['nickname'] ?? '').toString(),
                  comment: (map['comment'] ?? '').toString(),
                  createdAt: (map['created_at'] as int?) ?? 0,
                  printLatencyMs: (map['print_latency_ms'] as int?) ?? 0,
                  printSuccess: ((map['print_success'] as int?) ?? 0) == 1,
                );
          }

          class SettingsService extends ChangeNotifier {
            late SharedPreferences _prefs;
            String relayUrl = 'ws://192.168.1.100:8080';
            String tiktokUniqueId = '';
            int paperWidthMm = 58;
            bool autoCutPaper = false;
            String savedPrinterMac = '';
            String savedPrinterName = '';
            String shopName = 'THẢO NGUYÊN STORE';
            String shopPhone = '0353.781.518';
            String shopFooter = 'Cảm ơn quý khách đã chốt đơn!';
            double fontScale = 1.0;

            Future<void> init() async {
              _prefs = await SharedPreferences.getInstance();
              relayUrl = _prefs.getString('relayUrl') ?? 'ws://192.168.1.100:8080';
              tiktokUniqueId = _prefs.getString('tiktokUniqueId') ?? '';
              paperWidthMm = _prefs.getInt('paperWidthMm') ?? 58;
              autoCutPaper = _prefs.getBool('autoCutPaper') ?? false;
              savedPrinterMac = _prefs.getString('savedPrinterMac') ?? '';
              savedPrinterName = _prefs.getString('savedPrinterName') ?? '';
              shopName = _prefs.getString('shopName') ?? 'THẢO NGUYÊN STORE';
              shopPhone = _prefs.getString('shopPhone') ?? '0353.781.518';
              shopFooter = _prefs.getString('shopFooter') ?? 'Cảm ơn quý khách đã chốt đơn!';
              fontScale = _prefs.getDouble('fontScale') ?? 1.0;
              notifyListeners();
            }

            Future<void> saveQuickSettings({
              required String newRelayUrl,
              required String newUniqueId,
              required int newPaperWidthMm,
              required bool newAutoCutPaper,
            }) async {
              relayUrl = newRelayUrl.trim();
              tiktokUniqueId = newUniqueId.trim().replaceAll('@', '');
              paperWidthMm = newPaperWidthMm;
              autoCutPaper = newAutoCutPaper;
              await _prefs.setString('relayUrl', relayUrl);
              await _prefs.setString('tiktokUniqueId', tiktokUniqueId);
              await _prefs.setInt('paperWidthMm', paperWidthMm);
              await _prefs.setBool('autoCutPaper', autoCutPaper);
              notifyListeners();
            }

            Future<void> saveTemplateSettings({
              required String newShopName,
              required String newShopPhone,
              required String newShopFooter,
              required double newFontScale,
            }) async {
              shopName = newShopName.trim();
              shopPhone = newShopPhone.trim();
              shopFooter = newShopFooter.trim();
              fontScale = newFontScale;
              await _prefs.setString('shopName', shopName);
              await _prefs.setString('shopPhone', shopPhone);
              await _prefs.setString('shopFooter', shopFooter);
              await _prefs.setDouble('fontScale', fontScale);
              notifyListeners();
            }

            Future<void> savePrinter(String mac, String name) async {
              savedPrinterMac = mac;
              savedPrinterName = name;
              await _prefs.setString('savedPrinterMac', mac);
              await _prefs.setString('savedPrinterName', name);
              notifyListeners();
            }
          }

          class LocalDatabase {
            Database? _db;

            Future<void> init() async {
              final dbPath = await getDatabasesPath();
              final path = p.join(dbPath, 'chotlive_v2.db');
              _db = await openDatabase(
                path,
                version: 1,
                onCreate: (db, version) async {
                  await db.execute('''
                    CREATE TABLE tickets (
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      msg_id TEXT,
                      unique_id TEXT,
                      nickname TEXT,
                      comment TEXT,
                      created_at INTEGER,
                      print_latency_ms INTEGER,
                      print_success INTEGER
                    )
                  ''');
                  await db.execute('CREATE INDEX idx_created_at ON tickets(created_at DESC)');
                },
              );
            }

            Future<int> insertTicket(PrintedTicket ticket) async {
              if (_db == null) return -1;
              return await _db!.insert('tickets', ticket.toMap());
            }

            Future<List<PrintedTicket>> getTickets({String query = '', int limit = 300}) async {
              if (_db == null) return [];
              if (query.trim().isEmpty) {
                final rows = await _db!.query('tickets', orderBy: 'created_at DESC', limit: limit);
                return rows.map((r) => PrintedTicket.fromMap(r)).toList();
              } else {
                final q = '%${query.trim()}%';
                final rows = await _db!.query(
                  'tickets',
                  where: 'nickname LIKE ? OR unique_id LIKE ? OR comment LIKE ?',
                  whereArgs: [q, q, q],
                  orderBy: 'created_at DESC',
                  limit: limit,
                );
                return rows.map((r) => PrintedTicket.fromMap(r)).toList();
              }
            }

            Future<String> exportCsv() async {
              final list = await getTickets(limit: 5000);
              final sb = StringBuffer('ID,ThoiGian,TikTokID,TenKhach,BinhLuan,TocDoInMs,TrangThai\n');
              for (final t in list) {
                final dt = DateFormat('yyyy-MM-dd HH:mm:ss')
                    .format(DateTime.fromMillisecondsSinceEpoch(t.createdAt));
                final safeComment = t.comment.replaceAll('"', '""');
                final safeName = t.nickname.replaceAll('"', '""');
                sb.writeln('${t.id},"$dt","${t.uniqueId}","$safeName","$safeComment",${t.printLatencyMs},${t.printSuccess ? "OK" : "LOI"}');
              }
              return sb.toString();
            }

            Future<void> clearAllTickets() async {
              if (_db == null) return;
              await _db!.delete('tickets');
            }
          }

          class TelemetryService extends ChangeNotifier {
            int clockOffsetMs = 0;
            final List<int> _relayToAppSamples = [];
            final List<int> _appToUiSamples = [];
            final List<int> _totalRelayToUiSamples = [];
            final List<int> _tapToPrintSamples = [];
            static const int _maxSamples = 500;

            void updateClockOffset(int clientSendTs, int serverTs, int clientRecvTs) {
              final rtt = clientRecvTs - clientSendTs;
              clockOffsetMs = serverTs - (clientSendTs + (rtt ~/ 2));
            }

            void recordCommentLatency({
              required int tRelayRecv,
              required int tAppRecv,
              required int tUiRender,
            }) {
              final adjustedAppRecv = tAppRecv + clockOffsetMs;
              final adjustedUiRender = tUiRender + clockOffsetMs;
              final netLatency = (adjustedAppRecv - tRelayRecv).clamp(0, 60000);
              final uiLatency = (tUiRender - tAppRecv).clamp(0, 60000);
              final totalLatency = (adjustedUiRender - tRelayRecv).clamp(0, 60000);
              _addSample(_relayToAppSamples, netLatency);
              _addSample(_appToUiSamples, uiLatency);
              _addSample(_totalRelayToUiSamples, totalLatency);
              notifyListeners();
            }

            void recordPrintDispatchLatency(int ms) {
              _addSample(_tapToPrintSamples, ms.clamp(0, 60000));
              notifyListeners();
            }

            void _addSample(List<int> list, int val) {
              if (list.length >= _maxSamples) list.removeAt(0);
              list.add(val);
            }

            int _percentile(List<int> data, double p) {
              if (data.isEmpty) return 0;
              final sorted = List<int>.from(data)..sort();
              final idx = ((sorted.length - 1) * p).round();
              return sorted[idx];
            }

            int get sampleCount => _totalRelayToUiSamples.length;
            int get printSampleCount => _tapToPrintSamples.length;
            int get relayToAppP50 => _percentile(_relayToAppSamples, 0.50);
            int get relayToAppP95 => _percentile(_relayToAppSamples, 0.95);
            int get appToUiP50 => _percentile(_appToUiSamples, 0.50);
            int get appToUiP95 => _percentile(_appToUiSamples, 0.95);
            int get totalRelayToUiP50 => _percentile(_totalRelayToUiSamples, 0.50);
            int get totalRelayToUiP95 => _percentile(_totalRelayToUiSamples, 0.95);
            int get tapToPrintP50 => _percentile(_tapToPrintSamples, 0.50);
            int get tapToPrintP95 => _percentile(_tapToPrintSamples, 0.95);

            void reset() {
              _relayToAppSamples.clear();
              _appToUiSamples.clear();
              _totalRelayToUiSamples.clear();
              _tapToPrintSamples.clear();
              notifyListeners();
            }
          }

          class CommentSource extends ChangeNotifier {
            final TelemetryService telemetry;
            WebSocketChannel? _channel;
            StreamSubscription? _sub;
            Timer? _reconnectTimer;
            Timer? _pingTimer;

            String connectionState = 'idle';
            String statusMessage = 'Chưa kết nối TikTok LIVE';
            String activeRelayUrl = '';
            String activeUniqueId = '';
            bool _manualDisconnect = true;

            final StreamController<LiveComment> _commentStreamController =
                StreamController<LiveComment>.broadcast(sync: true);

            Stream<LiveComment> get commentStream => _commentStreamController.stream;

            CommentSource({required this.telemetry});

            void connect({required String relayUrl, required String uniqueId}) {
              if (uniqueId.trim().isEmpty) {
                connectionState = 'error';
                statusMessage = 'Vui lòng nhập ID tài khoản TikTok đang LIVE';
                notifyListeners();
                return;
              }
              _manualDisconnect = false;
              activeRelayUrl = relayUrl.trim();
              activeUniqueId = uniqueId.trim().replaceAll('@', '');
              _establishConnection();
            }

            void _establishConnection() {
              _cleanupSocket();
              connectionState = 'connecting';
              statusMessage = 'Đang kết nối Relay & phòng LIVE @$activeUniqueId...';
              notifyListeners();
              try {
                _channel = WebSocketChannel.connect(Uri.parse(activeRelayUrl));
                _sub = _channel!.stream.listen(
                  _onMessageReceived,
                  onError: (err) => _handleDisconnect('Lỗi kết nối Relay: $err'),
                  onDone: () => _handleDisconnect('Mất kết nối tới máy chủ Relay.'),
                );
                _sendPing();
                _channel!.sink.add(jsonEncode({
                  'action': 'connect',
                  'uniqueId': activeUniqueId,
                }));
                _pingTimer = Timer.periodic(const Duration(seconds: 10), (_) => _sendPing());
              } catch (e) {
                _handleDisconnect('Không thể mở kết nối WebSocket: $e');
              }
            }

            void _sendPing() {
              try {
                _channel?.sink.add(jsonEncode({
                  'action': 'ping',
                  'client_ts': DateTime.now().millisecondsSinceEpoch,
                }));
              } catch (_) {}
            }

            void _onMessageReceived(dynamic rawData) {
              final int tAppRecv = DateTime.now().millisecondsSinceEpoch;
              try {
                final Map<String, dynamic> data = jsonDecode(rawData as String);
                final String type = data['type'] ?? '';
                if (type == 'chat') {
                  _commentStreamController.add(LiveComment(
                    msgId: data['msg_id']?.toString() ?? '$tAppRecv',
                    uniqueId: data['unique_id']?.toString() ?? '',
                    nickname: data['nickname']?.toString() ?? 'Khách',
                    comment: data['comment']?.toString() ?? '',
                    tRelayRecv: (data['t_relay_recv'] as num?)?.toInt() ?? tAppRecv,
                    tAppRecv: tAppRecv,
                  ));
                  return;
                }
                if (type == 'pong') {
                  telemetry.updateClockOffset(
                    (data['client_ts'] as num).toInt(),
                    (data['server_ts'] as num).toInt(),
                    tAppRecv,
                  );
                  return;
                }
                if (type == 'status') {
                  connectionState = data['state']?.toString() ?? 'idle';
                  statusMessage = data['message']?.toString() ?? '';
                  notifyListeners();
                }
              } catch (_) {}
            }

            void _handleDisconnect(String reason) {
              _cleanupSocket();
              connectionState = 'disconnected';
              statusMessage = reason;
              notifyListeners();
              if (!_manualDisconnect) {
                _reconnectTimer?.cancel();
                _reconnectTimer = Timer(const Duration(seconds: 3), () {
                  if (!_manualDisconnect && activeUniqueId.isNotEmpty) {
                    _establishConnection();
                  }
                });
              }
            }

            void disconnect() {
              _manualDisconnect = true;
              _reconnectTimer?.cancel();
              try {
                _channel?.sink.add(jsonEncode({'action': 'disconnect'}));
              } catch (_) {}
              _cleanupSocket();
              connectionState = 'idle';
              statusMessage = 'Đã ngắt kết nối.';
              notifyListeners();
            }

            void _cleanupSocket() {
              _pingTimer?.cancel();
              _sub?.cancel();
              try {
                _channel?.sink.close();
              } catch (_) {}
              _channel = null;
            }
          }

          class PrinterService extends ChangeNotifier {
            final SettingsService settings;
            bool isConnected = false;
            bool isScanning = false;
            String statusMessage = 'Chưa kết nối máy in';
            List<BluetoothInfo> devices = [];
            Future<void> _printQueue = Future.value();

            PrinterService({required this.settings});

            Future<bool> requestBluetoothPermissions() async {
              final statuses = await [
                Permission.bluetoothScan,
                Permission.bluetoothConnect,
                Permission.locationWhenInUse,
              ].request();
              return statuses[Permission.bluetoothConnect]?.isGranted == true ||
                  await PrintBluetoothThermal.isPermissionBluetoothGranted;
            }

            Future<void> autoReconnectSavedPrinter() async {
              if (settings.savedPrinterMac.isEmpty) return;
              final granted = await requestBluetoothPermissions();
              if (!granted) return;
              final alreadyConnected = await PrintBluetoothThermal.connectionStatus;
              if (alreadyConnected) {
                isConnected = true;
                statusMessage = 'Đã kết nối: ${settings.savedPrinterName}';
                notifyListeners();
                return;
              }
              await connectPrinter(settings.savedPrinterMac, settings.savedPrinterName);
            }

            Future<void> scanDevices() async {
              isScanning = true;
              statusMessage = 'Đang quét thiết bị Bluetooth...';
              notifyListeners();
              try {
                final granted = await requestBluetoothPermissions();
                if (!granted) {
                  statusMessage = 'Chưa được cấp quyền Bluetooth trên Android.';
                  isScanning = false;
                  notifyListeners();
                  return;
                }
                devices = await PrintBluetoothThermal.pairedBluetooths;
                statusMessage = 'Tìm thấy ${devices.length} thiết bị Bluetooth đã ghép đôi.';
              } catch (e) {
                statusMessage = 'Lỗi quét thiết bị: $e';
              } finally {
                isScanning = false;
                notifyListeners();
              }
            }

            Future<bool> connectPrinter(String mac, String name) async {
              statusMessage = 'Đang kết nối tới $name ($mac)...';
              notifyListeners();
              try {
                final result = await PrintBluetoothThermal.connect(macPrinterAddress: mac);
                isConnected = result;
                if (result) {
                  await settings.savePrinter(mac, name);
                  statusMessage = 'Đã kết nối máy in: $name';
                } else {
                  statusMessage = 'Kết nối thất bại tới $name. Kiểm tra nguồn máy in.';
                }
              } catch (e) {
                isConnected = false;
                statusMessage = 'Lỗi kết nối Bluetooth: $e';
              }
              notifyListeners();
              return isConnected;
            }

            Future<bool> enqueueTicketPrint({
              required String nickname,
              required String uniqueId,
              required String comment,
              required DateTime timestamp,
            }) {
              final completer = Completer<bool>();
              _printQueue = _printQueue.then((_) async {
                final ok = await _executeDirectPrint(
                  nickname: nickname,
                  uniqueId: uniqueId,
                  comment: comment,
                  timestamp: timestamp,
                );
                completer.complete(ok);
              }).catchError((_) {
                if (!completer.isCompleted) completer.complete(false);
              });
              return completer.future;
            }

            Future<bool> _executeDirectPrint({
              required String nickname,
              required String uniqueId,
              required String comment,
              required DateTime timestamp,
            }) async {
              try {
                bool currentStatus = await PrintBluetoothThermal.connectionStatus;
                if (!currentStatus && settings.savedPrinterMac.isNotEmpty) {
                  currentStatus = await PrintBluetoothThermal.connect(
                    macPrinterAddress: settings.savedPrinterMac,
                  );
                }
                if (!currentStatus) {
                  isConnected = false;
                  statusMessage = 'Mất kết nối máy in Bluetooth!';
                  notifyListeners();
                  return false;
                }
                isConnected = true;
                final int widthDots = settings.paperWidthMm == 80 ? 576 : 384;
                final List<int> escPosBytes = await _buildVietnameseReceiptBytes(
                  widthDots: widthDots,
                  shopName: settings.shopName,
                  shopPhone: settings.shopPhone,
                  nickname: nickname,
                  uniqueId: uniqueId,
                  comment: comment,
                  timeStr: DateFormat('HH:mm:ss - dd/MM/yyyy').format(timestamp),
                  footer: settings.shopFooter,
                  fontScale: settings.fontScale,
                  autoCut: settings.autoCutPaper,
                );
                final sent = await PrintBluetoothThermal.writeBytes(escPosBytes);
                if (!sent) {
                  statusMessage = 'Gửi lệnh in thất bại.';
                  notifyListeners();
                }
                return sent;
              } catch (e) {
                isConnected = false;
                statusMessage = 'Lỗi khi in: $e';
                notifyListeners();
                return false;
              }
            }

            Future<List<int>> _buildVietnameseReceiptBytes({
              required int widthDots,
              required String shopName,
              required String shopPhone,
              required String nickname,
              required String uniqueId,
              required String comment,
              required String timeStr,
              required String footer,
              required double fontScale,
              required bool autoCut,
            }) async {
              final recorder = ui.PictureRecorder();
              final canvas = Canvas(recorder);
              final double w = widthDots.toDouble();
              double y = 12.0;

              void drawBlock(
                String text, {
                required double fontSize,
                FontWeight weight = FontWeight.normal,
                TextAlign align = TextAlign.left,
              }) {
                final style = ui.TextStyle(
                  color: const Color(0xFF000000),
                  fontSize: fontSize * fontScale,
                  fontWeight: weight,
                );
                final paraBuilder = ui.ParagraphBuilder(ui.ParagraphStyle(textAlign: align))
                  ..pushStyle(style)
                  ..addText(text);
                final para = paraBuilder.build()..layout(ui.ParagraphConstraints(width: w - 16));
                canvas.drawParagraph(para, Offset(8, y));
                y += para.height + 6;
              }

              void drawDivider() {
                final paint = Paint()
                  ..color = const Color(0xFF000000)
                  ..strokeWidth = 2.0;
                canvas.drawLine(Offset(0, y + 4), Offset(w, y + 4), paint);
                y += 12;
              }

              if (shopName.isNotEmpty) {
                drawBlock(shopName, fontSize: 26, weight: FontWeight.bold, align: TextAlign.center);
              }
              if (shopPhone.isNotEmpty) {
                drawBlock('SĐT: $shopPhone', fontSize: 20, align: TextAlign.center);
              }
              drawDivider();
              drawBlock(nickname, fontSize: 30, weight: FontWeight.bold);
              drawBlock('@$uniqueId  |  $timeStr', fontSize: 18);
              drawDivider();
              drawBlock(comment, fontSize: 32, weight: FontWeight.bold);
              drawDivider();
              if (footer.isNotEmpty) {
                drawBlock(footer, fontSize: 18, align: TextAlign.center);
              }

              final int heightDots = (y + 16).ceil();
              final picture = recorder.endRecording();
              final ui.Image img = await picture.toImage(widthDots, heightDots);
              final ByteData? rgbaData = await img.toByteData(format: ui.ImageByteFormat.rawRgba);
              final Uint8List pixels = rgbaData!.buffer.asUint8List();

              final int bytesPerRow = widthDots ~/ 8;
              final List<int> bytes = [
                0x1B, 0x40,
                0x1D, 0x76, 0x30, 0x00,
                bytesPerRow & 0xFF,
                (bytesPerRow >> 8) & 0xFF,
                heightDots & 0xFF,
                (heightDots >> 8) & 0xFF,
              ];

              for (int row = 0; row < heightDots; row++) {
                for (int colByte = 0; colByte < bytesPerRow; colByte++) {
                  int b = 0;
                  for (int bit = 0; bit < 8; bit++) {
                    final int x = colByte * 8 + bit;
                    final int idx = (row * widthDots + x) * 4;
                    final int alpha = pixels[idx + 3];
                    final int lum = (pixels[idx] + pixels[idx + 1] + pixels[idx + 2]) ~/ 3;
                    if (alpha > 90 && lum < 160) {
                      b |= (1 << (7 - bit));
                    }
                  }
                  bytes.add(b);
                }
              }

              bytes.addAll([0x1B, 0x64, 0x04]);
              if (autoCut) {
                bytes.addAll([0x1D, 0x56, 0x42, 0x00]);
              }
              return bytes;
            }
          }

          class TicketService {
            final PrinterService printerService;
            final LocalDatabase localDatabase;
            final TelemetryService telemetryService;

            TicketService({
              required this.printerService,
              required this.localDatabase,
              required this.telemetryService,
            });

            Future<bool> tapAndPrintImmediately(LiveComment item, {required VoidCallback onStateChanged}) async {
              final int tTapStart = DateTime.now().millisecondsSinceEpoch;
              final DateTime now = DateTime.fromMillisecondsSinceEpoch(tTapStart);

              item.lastPrintStatus = 'printing';
              onStateChanged();

              final bool printedOk = await printerService.enqueueTicketPrint(
                nickname: item.nickname,
                uniqueId: item.uniqueId,
                comment: item.comment,
                timestamp: now,
              );

              final int dispatchDurationMs = DateTime.now().millisecondsSinceEpoch - tTapStart;
              telemetryService.recordPrintDispatchLatency(dispatchDurationMs);

              if (printedOk) {
                item.printCount += 1;
                item.lastPrintStatus = 'printed';
              } else {
                item.lastPrintStatus = 'error';
              }
              onStateChanged();

              final ticket = PrintedTicket(
                msgId: item.msgId,
                uniqueId: item.uniqueId,
                nickname: item.nickname,
                comment: item.comment,
                createdAt: tTapStart,
                printLatencyMs: dispatchDurationMs,
                printSuccess: printedOk,
              );
              unawaited(localDatabase.insertTicket(ticket));
              return printedOk;
            }
          }

